name: Publish shenghuo2 Docker image

on:
  push:
    tags:
      - 'v*-service-tier.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Fork version, for example v1.0.0-beta6-service-tier.1'
        required: true
        type: string

concurrency:
  group: docker-fork-${{ github.ref }}
  cancel-in-progress: false

env:
  DOCKER_IMAGE: shenghuo2/axonhub

jobs:
  prepare:
    name: Validate version
    runs-on: ubuntu-latest
    if: github.repository == 'shenghuo2/axonhub'
    outputs:
      version: ${{ steps.version.outputs.version }}
      series: ${{ steps.version.outputs.series }}
      short_sha: ${{ steps.version.outputs.short_sha }}
    steps:
      - name: Resolve and validate version
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [[ "${GITHUB_EVENT_NAME}" == "push" ]]; then
            VERSION="${GITHUB_REF_NAME}"
          else
            VERSION="${DISPATCH_VERSION}"
          fi
          if [[ ! "${VERSION}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-beta[0-9]+-service-tier\.[0-9]+$ ]]; then
            echo "Invalid fork version: ${VERSION}" >&2
            exit 1
          fi
          BASE_VERSION="${VERSION%-service-tier.*}"
          SERIES="${BASE_VERSION##*-}-service-tier"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "series=${SERIES}" >> "${GITHUB_OUTPUT}"
          echo "short_sha=${GITHUB_SHA::12}" >> "${GITHUB_OUTPUT}"

  build_single_arch:
    name: Build & push (${{ matrix.arch }})
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Check out pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          labels: |
            org.opencontainers.image.version=${{ needs.prepare.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          build-args: |
            VERSION=${{ needs.prepare.outputs.version }}
            SOURCE_REPOSITORY=https://github.com/${{ github.repository }}
          tags: |
            ${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.version }}-${{ matrix.arch }}
            ${{ env.DOCKER_IMAGE }}:${{ needs.prepare.outputs.series }}-${{ matrix.arch }}
            ${{ env.DOCKER_IMAGE }}:sha-${{ needs.prepare.outputs.short_sha }}-${{ matrix.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false

  create_manifests:
    name: Create multi-architecture manifests
    needs: [prepare, build_single_arch]
    runs-on: ubuntu-latest
    steps:
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Publish version, series, and commit manifests
        env:
          VERSION: ${{ needs.prepare.outputs.version }}
          SERIES: ${{ needs.prepare.outputs.series }}
          SHORT_SHA: ${{ needs.prepare.outputs.short_sha }}
        run: |
          docker buildx imagetools create \
            -t "${DOCKER_IMAGE}:${VERSION}" \
            "${DOCKER_IMAGE}:${VERSION}-amd64" \
            "${DOCKER_IMAGE}:${VERSION}-arm64"
          docker buildx imagetools create \
            -t "${DOCKER_IMAGE}:${SERIES}" \
            "${DOCKER_IMAGE}:${SERIES}-amd64" \
            "${DOCKER_IMAGE}:${SERIES}-arm64"
          docker buildx imagetools create \
            -t "${DOCKER_IMAGE}:sha-${SHORT_SHA}" \
            "${DOCKER_IMAGE}:sha-${SHORT_SHA}-amd64" \
            "${DOCKER_IMAGE}:sha-${SHORT_SHA}-arm64"
