scalar Decimal
scalar DecimalInput
scalar Time

type APIKey {
  id: ID!
  key: String!
  name: String!
  scopes: [String!]
  profiles: APIKeyProfiles
}

type APIKeyProfiles {
  activeProfile: String!
  profiles: [APIKeyProfile!]
}

type APIKeyProfile {
  name: String!
  modelMappings: [ModelMapping!]
  channelIDs: [Int!]
  channelTags: [String!]
  channelTagsMatchMode: ChannelTagsMatchMode
  modelIDs: [String!]
  quota: APIKeyQuota
  loadBalanceStrategy: String
  traceStickyMode: String
}

type APIKeyQuota {
  requests: Int
  totalTokens: Int
  cost: Decimal
  period: APIKeyQuotaPeriod!
}

type APIKeyQuotaPeriod {
  type: APIKeyQuotaPeriodType!
  pastDuration: APIKeyQuotaPastDuration
  calendarDuration: APIKeyQuotaCalendarDuration
}

type APIKeyQuotaPastDuration {
  value: Int!
  unit: APIKeyQuotaPastDurationUnit!
}

type APIKeyQuotaCalendarDuration {
  unit: APIKeyQuotaCalendarDurationUnit!
}

type ModelMapping {
  from: String!
  to: String!
}

enum ChannelTagsMatchMode {
  any
  all
  none
}

enum APIKeyQuotaPeriodType {
  all_time
  past_duration
  calendar_duration
}

enum APIKeyQuotaPastDurationUnit {
  minute
  hour
  day
}

enum APIKeyQuotaCalendarDurationUnit {
  day
  month
}

input UpdateAPIKeyProfilesInput {
  activeProfile: String!
  profiles: [APIKeyProfileInput!]!
}

input APIKeyProfileInput {
  name: String!
  modelMappings: [ModelMappingInput!]
  channelIDs: [Int!]
  channelTags: [String!]
  channelTagsMatchMode: ChannelTagsMatchMode
  modelIDs: [String!]
  quota: APIKeyQuotaInput
  loadBalanceStrategy: String
  traceStickyMode: String
}

input APIKeyQuotaInput {
  requests: Int
  totalTokens: Int
  cost: DecimalInput
  period: APIKeyQuotaPeriodInput!
}

input APIKeyQuotaPeriodInput {
  type: APIKeyQuotaPeriodType!
  pastDuration: APIKeyQuotaPastDurationInput
  calendarDuration: APIKeyQuotaCalendarDurationInput
}

input APIKeyQuotaPastDurationInput {
  value: Int!
  unit: APIKeyQuotaPastDurationUnit!
}

input APIKeyQuotaCalendarDurationInput {
  unit: APIKeyQuotaCalendarDurationUnit!
}

input ModelMappingInput {
  from: String!
  to: String!
}

input LoadApiKeyProfileTemplateInput {
  """
  Template to load. Provide exactly one of templateID or templateName;
  templateName resolves within the caller's own project.
  """
  templateID: ID
  templateName: String
  """
  Target API key. Provide exactly one of apiKeyID or apiKeyName;
  apiKeyName resolves within the caller's own project.
  """
  apiKeyID: ID
  apiKeyName: String
}

extend type Mutation {
  createLLMAPIKey(name: String!): APIKey!
  """
  Updates the profiles of an API key. Provide exactly one of id or name;
  name resolves within the caller's own project, where API key names are unique.
  """
  updateAPIKeyProfiles(id: ID, name: String, input: UpdateAPIKeyProfilesInput!): APIKey!
  loadApiKeyProfileTemplate(input: LoadApiKeyProfileTemplateInput!): APIKey!
}

extend type Query {
  """
  Returns an API key's details (id, key, name, scopes, profiles).
  Provide exactly one of id, key, or name; all identify a key, and only keys
  inside the caller's own project are visible (requires the read_api_keys scope).
  """
  apiKey(id: ID, key: String, name: String): APIKey!

  """
  Returns quota usage for the profiles that have quota enabled on an API key.
  Provide exactly one of apiKeyId, key, or name; all identify a key, and only
  keys inside the caller's own project are visible (requires the read_api_keys
  scope).
  """
  apiKeyQuotaUsages(apiKeyId: ID, key: String, name: String): [APIKeyProfileQuotaUsage!]!

  """
  Resolves one API key in the caller's project to safe metadata. Provide
  exactly one selector. Requires read_usage_stats or read_usage_aggregates,
  and never returns the key.
  """
  projectAPIKey(id: ID, key: String, name: String): ProjectAPIKey!

  """
  Lists non-personal API keys in the caller's project using an opaque cursor.
  Requires read_usage_stats or read_usage_aggregates, and never returns key
  secrets.
  """
  projectAPIKeys(first: Int = 100, after: String): ProjectAPIKeyConnection!

  """
  Returns exact token usage grouped by API key, model, and requested service
  tier for the caller's project. Requires read_usage_stats.
  """
  apiKeyTokenUsageStats(input: APIKeyTokenUsageStatsInput!): [APIKeyTokenUsageStats!]!

  """
  Returns exact usage_logs aggregates grouped by API key and model. This does
  not join request records, so it remains complete after request cleanup.
  It requires read_usage_aggregates and never returns request data, API key
  secrets, or service tiers.
  """
  apiKeyUsageLogAggregates(input: APIKeyTokenUsageStatsInput!): [APIKeyUsageLogAggregate!]!
}

type APIKeyProfileQuotaUsage {
  profileName: String!
  quota: APIKeyQuota!
  window: APIKeyQuotaWindow!
  usage: APIKeyQuotaUsage!
}

type APIKeyQuotaUsage {
  requestCount: Int!
  totalTokens: Int!
  totalCost: Decimal!
}

type APIKeyQuotaWindow {
  start: Time
  end: Time
}

"""
Safe API key metadata for usage integrations. This type never exposes the
plaintext key, scopes, profiles, or other credentials.
"""
type ProjectAPIKey {
  id: ID!
  name: String!
  type: String!
  status: String!
}

type ProjectAPIKeyEdge {
  cursor: String!
  node: ProjectAPIKey!
}

type ProjectAPIKeyPageInfo {
  hasNextPage: Boolean!
  endCursor: String
}

type ProjectAPIKeyConnection {
  edges: [ProjectAPIKeyEdge!]!
  pageInfo: ProjectAPIKeyPageInfo!
}

input APIKeyTokenUsageStatsInput {
  apiKeyIds: [ID!]!
  createdAtGTE: Time
  createdAtLTE: Time
}

type APIKeyTokenUsageStats {
  apiKeyId: ID!
  inputTokens: Int!
  outputTokens: Int!
  cachedTokens: Int!
  reasoningTokens: Int!
  modelServiceTierUsages: [ModelServiceTierTokenUsageStats!]!
}

"""
Exact usage_logs totals for one API key. Unlike APIKeyTokenUsageStats, this
type intentionally has no service-tier breakdown because it never reads the
requests table.
"""
type APIKeyUsageLogAggregate {
  apiKeyId: ID!
  inputTokens: Int!
  outputTokens: Int!
  cachedTokens: Int!
  reasoningTokens: Int!
  modelUsages: [ModelTokenUsageStats!]!
}

type ModelTokenUsageStats {
  modelId: String!
  inputTokens: Int!
  outputTokens: Int!
  cachedTokens: Int!
  reasoningTokens: Int!
}

"""
Exact token usage for one model and requested service tier. A null
serviceTier represents requests that did not specify a tier.
"""
type ModelServiceTierTokenUsageStats {
  modelId: String!
  serviceTier: String
  inputTokens: Int!
  outputTokens: Int!
  cachedTokens: Int!
  reasoningTokens: Int!
}
